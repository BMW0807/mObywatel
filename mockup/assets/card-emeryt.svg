<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="zusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <radialGradient id="zusGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(52,211,153,0.3)"/>
      <stop offset="100%" stop-color="rgba(6,78,59,0)"/>
    </radialGradient>
    <pattern id="guillocheZus" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="16" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
      <circle cx="18" cy="18" r="10" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="400" rx="36" fill="url(#zusGrad)"/>
  <rect width="600" height="400" rx="36" fill="url(#guillocheZus)"/>
  <rect width="600" height="400" rx="36" fill="url(#zusGlow)"/>
  <!-- Decorative security waves -->
  <path d="M 0 110 Q 300 150 600 100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <path d="M 0 118 Q 300 158 600 108" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <path d="M 0 320 Q 300 280 600 330" fill="none" stroke="rgba(52,211,153,0.15)" stroke-width="2"/>
  <!-- ZUS Eagle / Emblem Watermark -->
  <g transform="translate(440, 220)" stroke="rgba(255,255,255,0.07)" stroke-width="3" fill="none">
    <circle cx="0" cy="0" r="64"/>
    <path d="M -30 -15 L 0 -45 L 30 -15 L 18 35 L -18 35 Z"/>
    <circle cx="0" cy="-5" r="12"/>
    <path d="M -45 0 Q -20 25 0 25 Q 20 25 45 0" stroke-width="2"/>
  </g>
  <!-- Top right badge -->
  <rect x="500" y="36" width="62" height="26" rx="6" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="531" y="53" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5" text-anchor="middle">ZUS</text>
</svg>