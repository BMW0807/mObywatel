name: Deploy mobywatel-ai (Docker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Połączenie SSH i wdrożenie przez Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/bmw/mobywatel-ai

            # Wdrożenie dokładnie tego, co jest na origin/main.
            # Reset obsługuje także wymuszone przepisanie historii repozytorium.
            git fetch --prune origin main
            git reset --hard origin/main

            # Przebudowanie i ponowne uruchomienie kontenerów w tle
            docker compose down
            docker compose build --no-cache
            docker compose up -d

            # Sprawdzenie statusu kontenerów
            docker compose ps