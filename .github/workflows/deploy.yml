name: Deploy mobywatel-ai (Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Testy API (/api/health, /api/agent)
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Sprawdzenie składni i uruchomienie testów jednostkowych
        run: |
          python3 -m py_compile serwer/server.py serwer/agent.py serwer/dane.py serwer/akcje.py serwer/persony.py
          python3 -m unittest discover -s serwer -p "test_*.py" -v

  deploy:
    name: Wdrożenie Docker i weryfikacja po deployu
    needs: test
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL || 'https://mobywat.duckdns.org' }}
    steps:
      - name: Połączenie SSH i wdrożenie przez Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/bmw/mobywatel-ai

            # Wdrożenie dokładnie tego, co jest na origin/main.
            # Reset obsługuje także wymuszone przepisanie historii repozytorium.
            git fetch --prune origin main
            git reset --hard origin/main

            # Upewnienie się, że plik .env istnieje dla docker compose
            touch .env

            # Przebudowanie i ponowne uruchomienie kontenerów w tle
            docker compose down
            docker compose build --no-cache
            docker compose up -d

            # Sprawdzenie lokalnego /api/health i widoku aplikacji w kontenerze
            ok=0
            for i in $(seq 1 15); do
              if health_json=$(curl -fsS --max-time 5 http://127.0.0.1:8790/api/health 2>/dev/null) \
                 && echo "$health_json" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' \
                 && curl -fsS --max-time 5 http://127.0.0.1:8790/aplikacja | grep -q '<title>mObywatel</title>'; then
                echo "Lokalny serwis odpowiada poprawnie (próba $i): $health_json"
                ok=1
                break
              fi
              echo "Oczekiwanie na start kontenera ($i/15)..."
              sleep 2
            done

            docker compose ps
            if [ "$ok" -ne 1 ]; then
              echo "BŁĄD: Kontener nie przeszedł weryfikacji /api/health lub /aplikacja po deployu."
              docker compose logs --tail=80
              exit 1
            fi

      - name: Weryfikacja publicznego adresu aplikacji i /api/health
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          base = os.environ.get('APP_URL', 'https://mobywat.duckdns.org').rstrip('/')
          last_err = None

          for attempt in range(1, 13):
              try:
                  with urllib.request.urlopen(base + '/api/health', timeout=10) as r:
                      health = json.loads(r.read().decode('utf-8'))
                      if r.status != 200 or health.get('ok') is not True:
                          raise RuntimeError(f'Nieprawidłowa odpowiedź /api/health ({r.status}): {health}')

                  for path in ('/', '/aplikacja'):
                      with urllib.request.urlopen(base + path, timeout=10) as r2:
                          html = r2.read().decode('utf-8', 'replace')
                          if r2.status != 200 or 'mObywatel' not in html:
                              raise RuntimeError(f'Nieprawidłowa odpowiedź {path} ({r2.status})')

                  print(f'Publiczny adres {base} zweryfikowany pomyślnie (próba {attempt}):', {
                      'ok': health.get('ok'),
                      'status': health.get('status'),
                      'agent': health.get('agent'),
                      'provider': health.get('provider'),
                      'model': health.get('model'),
                  })
                  sys.exit(0)
              except Exception as exc:
                  last_err = exc
                  print(f'Próba {attempt}/12 nieudana: {exc}')
                  time.sleep(3)

          print(f'BŁĄD: Publiczny adres {base} nie przeszedł weryfikacji: {last_err}', file=sys.stderr)
          sys.exit(1)
          PY
